# O que a gente afirma sobre o Intenza e como sabe.
#
# basis (da mais forte para a mais fraca):
#   by-construction   o tipo/estrutura torna a violação irrepresentável      (a priori)
#   proof-exhaustive  domínio finito enumerado por inteiro num teste          (a priori)
#   property-tested   alegação universal amostrada por entradas geradas       (a priori, indutiva)
#   example-tested    exemplos escolhidos                                     (a priori)
#   measured          sobreviveu a uma tentativa de refutação no sistema vivo  (a posteriori)
#   testimony         emprestado de norma ou regulador                        (testemunhal)
#   conjecture        ainda sem suporte: dívida epistêmica
#
# Uma alegação muda de base quando a evidência chega; o verificador barra a promoção sem prova.

claims:
  # --- selagem --------------------------------------------------------------
  - id: sealed-price-encrypted-at-rest
    statement: O preço da proposta é gravado cifrado com AES-256-GCM, chave derivada por intenção (HKDF) e dados associados que amarram proposta, vendedor e intenção.
    about: [proposal]
    kind: integrity
    basis: example-tested
    evidence:
      - test: internal/domain/proposal.TestSealedPriceIsBoundToItsProposal
      - test: internal/domain/proposal.TestKeyRotationKeepsOldPricesReadable

  - id: reveal-gated-by-persisted-close
    statement: O preço só abre depois que a intenção foi fechada no banco, sob o relógio do banco. Relógio local adiantado não antecipa a revelação.
    about: [proposal, intent]
    kind: safety
    basis: by-construction
    evidence:
      - symbol: internal/domain/proposal.Reveal
      - test: internal/domain/proposal.TestRevealIgnoresTheLocalClock

  - id: events-carry-no-price
    statement: Nenhum evento de proposta publicado carrega preço.
    about: [proposal, event-record]
    kind: safety
    basis: example-tested
    evidence:
      - test: internal/domain/proposal.TestEventsCarryNoPrice

  - id: no-bid-after-close
    statement: Nenhuma proposta é aceita depois do fechamento, nem em corrida com o fechador.
    about: [proposal, intent]
    kind: safety
    basis: by-construction
    evidence:
      - symbol: internal/adapter/mongo.guardFilter
      - test: internal/domain/intent.TestNoProposalAtOrAfterTheDeadline
      - test: internal/integration.TestNoProposalAfterCloseUnderRace
    notes: O envio grava a intenção com a guarda status open e closes_at maior que $$NOW, na mesma transação. A corrida com o fechador vira conflito de escrita e a nova tentativa já vê a intenção fechada.

  - id: effective-status-is-time-function
    statement: O estado efetivo de uma intenção é função pura do relógio recebido. Timer atrasado não muda o que se lê.
    about: [intent]
    kind: safety
    basis: example-tested
    evidence:
      - test: internal/domain/intent.TestEffectiveStatusIsAFunctionOfTime

  - id: phases-match-state-machines
    statement: As fases declaradas na ontologia são exatamente os estados alcançáveis das máquinas de estado, e as fases terminais não têm saída.
    about: [intent, proposal, agreement]
    kind: integrity
    basis: proof-exhaustive
    evidence:
      - test: internal/domain/intent.TestMachineMatchesTheOntologyPhases
      - test: internal/domain/proposal.TestMachineMatchesTheOntologyPhases
      - test: internal/domain/agreement.TestSettlementOutcomesAreExclusive

  # --- seleção e acordo -----------------------------------------------------
  - id: selection-deterministic-explainable
    statement: A ordenação das propostas é função pura de critérios e pesos, invariante à ordem de chegada, e uma proposta dominada nunca fica acima de quem a domina.
    about: [proposal, intent]
    kind: economic
    basis: property-tested
    evidence:
      - test: internal/domain/selection.TestRankingIsPermutationInvariant
      - test: internal/domain/selection.TestDominatedNeverRanksAboveItsDominator
      - test: internal/domain/selection.TestScoresContributionsAndPareto

  - id: single-award-per-intent
    statement: Uma intenção gera no máximo um acordo.
    about: [intent, agreement]
    kind: safety
    basis: example-tested
    evidence:
      - test: internal/domain/intent.TestLifecycle
      - test: internal/integration.TestSingleAwardUnderRace
    notes: A máquina de estados recusa a segunda adjudicação, a versão da intenção barra a escrita concorrente e o índice único em agreements.intent_id é o último piso.

  - id: terms-snapshot-tamper-evident
    statement: Os termos do acordo são congelados em JSON canônico e o SHA-256 vai junto. Qualquer alteração muda o hash.
    about: [terms-snapshot, agreement]
    kind: integrity
    basis: example-tested
    evidence:
      - symbol: internal/domain/agreement.Agreement.VerifyTerms
      - test: internal/domain/agreement.TestTermsHashDetectsTampering

  - id: dispute-is-field-conference
    statement: Disputa é conferência de campos. Cada reclamação compara esperado contra observado de um atributo probatório do schema congelado.
    about: [dispute, field-claim, attribute]
    kind: integrity
    basis: example-tested
    evidence:
      - test: internal/domain/schema.TestConferenceOnlyAboutEvidentiaryTerms
      - test: internal/domain/agreement.TestDisputeNeedsADiscrepancyOnAFixedField

  - id: generated-items-satisfy-own-predicates
    statement: Em qualquer folha do catálogo, um item sorteado válido passa no parser, satisfaz as restrições derivadas dele e não diverge de si na conferência.
    about: [attribute-schema, attribute]
    kind: integrity
    basis: property-tested
    evidence:
      - test: internal/domain/schema.TestGeneratedItemsRoundTripOnEveryLeaf
      - test: internal/domain/schema.TestAdherenceIsBounded

  # --- dinheiro -------------------------------------------------------------
  - id: platform-never-holds-funds
    statement: Nenhum caminho de código leva dinheiro para conta da plataforma. A porta do escrow só abre, libera e estorna.
    about: [escrow, escrow-agent]
    kind: regulatory
    basis: by-construction
    evidence:
      - symbol: internal/app.Escrow

  - id: payment-institution-regulated
    statement: Custódia de recursos de terceiros exige instituição de pagamento autorizada pelo Banco Central.
    about: [escrow-agent]
    kind: regulatory
    basis: testimony
    review: pending
    evidence:
      - source: Lei nº 12.865/2013 (arranjos e instituições de pagamento do SPB) e regulamentação do BCB

  - id: escrow-command-idempotent
    statement: Comandos ao escrow carregam chave de idempotência. Repetir não duplica efeito.
    about: [escrow]
    kind: safety
    basis: example-tested
    evidence:
      - test: internal/integration.TestSettlementSagaAgainstSimulatedAgent
      - test: internal/domain/agreement.TestHappyPathReleases

  - id: settlement-terminal-exclusive
    statement: Liberado, estornado e cancelado são terminais e exclusivos. Um acordo nunca libera e estorna.
    about: [agreement, escrow]
    kind: safety
    basis: proof-exhaustive
    evidence:
      - test: internal/domain/agreement.TestSettlementOutcomesAreExclusive

  - id: webhook-handling-idempotent
    statement: Webhook duplicado ou fora de ordem não muda o resultado. A máquina de estados recusa transição inválida e o evento é deduplicado.
    about: [escrow, agreement]
    kind: safety
    basis: example-tested
    evidence:
      - test: internal/domain/agreement.TestSettledIsIdempotentAndOrderAware
      - test: internal/integration.TestSettlementSagaAgainstSimulatedAgent
      - test: internal/adapter/escrow.TestSignatureRoundTripAndReplayWindow

  - id: reconciliation-converges
    statement: Com webhooks perdidos, a reconciliação leva todo acordo ao estado do agente de custódia em até 2 minutos.
    about: [agreement, escrow]
    kind: liveness
    basis: conjecture

  - id: psp-calls-bounded
    statement: Chamadas ao agente de custódia têm prazo, disjuntor e retentativa com jitter. Com cauda lognormal, o p99 da API fica abaixo de 1 s.
    about: [escrow, escrow-agent]
    kind: performance
    basis: conjecture

  # --- taxonomia e prova ----------------------------------------------------
  - id: forbidden-categories-unrepresentable
    statement: Categorias proibidas (armas, medicamentos, animais, tabaco, álcool) não existem na árvore, e um identificador de categoria só nasce de um nó dela.
    about: [category]
    kind: safety
    basis: by-construction
    evidence:
      - symbol: internal/domain/taxonomy.Tree.Lookup
      - test: internal/domain/taxonomy.TestForbiddenCategoriesDoNotExist
      - test: internal/domain/taxonomy.TestLoaderRefusesForbiddenAnchorsAndTerms

  - id: autoparts-restricted-by-design
    statement: Autopeças só aceitam vendedor com credencial de desmonte e peça com código de rastreabilidade. Sistemas de segurança não existem na árvore.
    about: [category, seller]
    kind: regulatory
    basis: example-tested
    evidence:
      - test: internal/domain/taxonomy.TestDefaultCatalogShape
      - test: internal/domain/taxonomy.TestLoaderRefusesForbiddenAnchorsAndTerms

  - id: dismantling-law
    statement: Desmonte de veículo exige credenciamento no órgão de trânsito do estado e peças com rastreabilidade até o veículo de origem.
    about: [category, seller]
    kind: regulatory
    basis: testimony
    review: pending
    evidence:
      - source: Lei nº 12.977/2014 (Lei do Desmonte) e regulamentação do CONTRAN

  - id: identifiers-check-digit-validated
    statement: Identificadores normativos (GTIN, ISBN, VIN, CPF, CNPJ, RENAVAM) passam pelo dígito verificador antes de virar prova.
    about: [gtin, isbn, vin, cpf, cnpj, renavam]
    kind: integrity
    basis: example-tested
    evidence:
      - test: internal/domain/schema.TestNormativeKindsValidateThroughStandards

  - id: check-digits-catch-single-substitutions
    statement: GTIN, ISBN-10 e VIN detectam toda substituição de um caractere. No VIN, a exceção são letras com a mesma transliteração (A e J valem 1).
    about: [gtin, isbn, vin]
    kind: integrity
    basis: proof-exhaustive
    evidence:
      - test: standards/gs1/gtin.TestCheckDigitDetectionIsExactlyKnown
      - test: standards/iso/iso2108.TestISBN10DetectsEverySubstitutionAndTransposition
      - test: standards/iso/iso3779.TestEverySubstitutionChangesTheCheckOrCollidesInTransliteration

  - id: gtin-misses-transpositions-by-five
    statement: O dígito do GTIN não detecta troca de vizinhos que diferem em 5 (05 por 50). O ISBN-10 detecta toda troca de vizinhos.
    about: [gtin, isbn]
    kind: integrity
    basis: proof-exhaustive
    evidence:
      - test: standards/gs1/gtin.TestCheckDigitDetectionIsExactlyKnown
      - test: standards/iso/iso2108.TestISBN10DetectsEverySubstitutionAndTransposition

  - id: cpf-check-is-imperfect
    statement: O CPF deixa passar cerca de 0,2% das substituições de um dígito, porque os restos 0 e 1 viram o mesmo dígito.
    about: [cpf]
    kind: integrity
    basis: property-tested
    evidence:
      - test: standards/rfb/cpf.TestSingleSubstitutionDetectionRate

  - id: cnpj-alphanumeric-extends-legacy
    statement: A regra do CNPJ alfanumérico coincide com a regra numérica antiga em toda base só de dígitos.
    about: [cnpj]
    kind: integrity
    basis: property-tested
    evidence:
      - test: standards/rfb/cnpj.TestAlphanumericRuleAgreesWithLegacyOnDigits

  - id: gs1-prefix-is-not-origin
    statement: O prefixo GS1 de um GTIN diz quem emitiu o número, não onde o produto foi feito.
    about: [gtin]
    kind: integrity
    basis: testimony
    review: done
    evidence:
      - source: GS1 — GS1 Company Prefix
        url: https://www.gs1.org/standards/id-keys/company-prefix

  - id: normative-tables-match-extracts
    statement: As tabelas compiladas das normas vêm dos extratos versionados. O sha256 do extrato vai no código gerado e um teste confere.
    about: [currency, country, language, mcc]
    kind: integrity
    basis: example-tested
    evidence:
      - test: standards/iso/iso4217.TestGeneratedTablesMatchExtract
      - test: standards/iso/iso3166.TestGeneratedTablesMatchExtract
      - test: standards/iso/iso639.TestGeneratedTablesMatchExtract
      - test: standards/iso/iso18245.TestGeneratedTablesMatchExtract
      - test: standards/un/m49.TestGeneratedTablesMatchExtract

  - id: normative-lookups-allocation-free
    statement: Consultas por código nas normas são O(1) e não alocam memória.
    about: [currency, country]
    kind: performance
    basis: example-tested
    evidence:
      - test: standards/iso/iso4217.TestLookupsDoNotAllocate
      - test: standards/iso/iso3166.TestLookupsDoNotAllocate
      - bench: standards/iso/iso4217.BenchmarkByAlpha

  - id: jcs-reproduces-rfc-vectors
    statement: A canonicalização reproduz byte a byte as amostras do RFC 8785, inclusive a ordem por unidades UTF-16, e recusa nomes duplicados.
    about: [terms-snapshot]
    kind: integrity
    basis: example-tested
    evidence:
      - test: standards/ietf/rfc8785.TestNumberSamplesFromAppendixB
      - test: standards/ietf/rfc8785.TestSampleFromSection3
      - test: standards/ietf/rfc8785.TestPropertySortingByUTF16
      - test: standards/ietf/rfc8785.TestRejectsDuplicatesAndTrailingData

  - id: uuid-v7-strictly-increasing
    statement: Os IDs v7 crescem estritamente mesmo com relógio parado, voltando no tempo ou estourando o contador do milissegundo.
    about: [entity-id]
    kind: integrity
    basis: example-tested
    evidence:
      - test: standards/ietf/rfc9562.TestMonotonicUnderAdversarialClocks

  - id: durations-keep-nominal-apart
    statement: Durações separam o nominal do exato. P1D atravessa o horário de verão mantendo o relógio de parede, PT24H não, e P1M nunca vira nanossegundos.
    about: [duration]
    kind: integrity
    basis: example-tested
    evidence:
      - test: standards/iso/iso8601.TestNominalVersusExact

  - id: brcode-composes-norms
    statement: O BR Code compõe MCC, moeda 986, país BR e o CRC EMV, e o exemplo do manual do BCB reencoda byte a byte.
    about: [payment-code]
    kind: integrity
    basis: example-tested
    evidence:
      - test: standards/emvco/mpm.TestParseSplitAndSeal
      - test: standards/bcb/brcode.TestManualExample

  # --- mensageria -----------------------------------------------------------
  - id: outbox-atomic-with-state
    statement: Mudança de estado e evento são gravados na mesma transação. Não existe estado sem evento nem evento sem estado.
    about: [event-record, intent, proposal, agreement]
    kind: integrity
    basis: example-tested
    evidence:
      - test: internal/integration.TestOutboxIsAtomicWithState
      - test: internal/integration.TestEndToEndMarket

  - id: consumers-effectively-once
    statement: Cada consumidor aplica um evento no máximo uma vez, com inbox único por consumidor e evento na mesma transação do efeito.
    about: [event-record, reputation]
    kind: integrity
    basis: example-tested
    evidence:
      - symbol: internal/adapter/mongo.Store.Once
      - test: internal/integration.TestRelayAtLeastOnceAndInboxEffectivelyOnce

  - id: backlog-drains
    statement: Depois de uma queda do broker, o backlog do outbox drena em até 60 s sem perder evento.
    about: [event-record]
    kind: liveness
    basis: conjecture

  - id: poison-message-isolated
    statement: Evento malformado vai para a fila de mortos depois de 3 tentativas e não trava a partição.
    about: [event-record]
    kind: liveness
    basis: conjecture

  # --- Redis, carga e cache -------------------------------------------------
  - id: intent-creation-idempotent
    statement: Repetir a criação de intenção com a mesma Idempotency-Key devolve a mesma intenção, com ou sem Redis.
    about: [intent]
    kind: safety
    basis: by-construction
    evidence:
      - symbol: internal/app.Market.PublishIntent
      - test: internal/integration.TestEndToEndMarket
    notes: O id da intenção é um UUIDv8 derivado de comprador e chave; o _id único do Mongo é a garantia. O Redis não participa da idempotência.

  - id: deadlines-survive-redis-loss
    statement: Sem Redis, os fechamentos acontecem pela varredura no banco com atraso abaixo de 30 s.
    about: [intent]
    kind: liveness
    basis: conjecture

  - id: rate-limit-protects-p99
    statement: Na corrida de última hora, o limite GCRA mantém o p99 de envio de proposta abaixo de 500 ms para quem está dentro da cota.
    about: [proposal]
    kind: performance
    basis: conjecture

  - id: mongo-outage-fails-fast
    statement: Com o banco pausado, a API responde 503 em menos de 2 s em vez de pendurar, e volta sozinha.
    about: [intent]
    kind: performance
    basis: conjecture

  - id: cache-early-refresh
    statement: Expiração antecipada probabilística evita estouro de recomputação no cache de reputação.
    about: [reputation]
    kind: performance
    basis: conjecture

  # --- reputação ------------------------------------------------------------
  - id: reputation-shrinks-small-samples
    statement: Com poucas avaliações, a reputação encolhe para a média da plataforma. Um 5 isolado não supera um histórico longo de 4,8.
    about: [reputation]
    kind: economic
    basis: property-tested
    evidence:
      - test: internal/domain/reputation.TestShrinkageAgainstLuckyNewcomers
      - test: internal/domain/reputation.TestIntervalShrinksWithEvidence

  - id: credible-intervals-from-beta-inversion
    statement: O intervalo de credibilidade de 95% vem da inversa da beta incompleta regularizada e bate com as formas fechadas conhecidas.
    about: [reputation]
    kind: integrity
    basis: example-tested
    evidence:
      - test: internal/domain/reputation.TestQuantilesAgainstClosedForms
      - test: internal/domain/reputation.TestSamplingMatchesThePosteriorMean

  - id: exploration-exposes-new-sellers
    statement: Na notificação de intenções, amostragem de Thompson dá exposição mínima a vendedores sem histórico.
    about: [seller, reputation]
    kind: economic
    basis: example-tested
    evidence:
      - test: internal/domain/reputation.TestThompsonSamplingExposesNewcomers
    notes: Monte Carlo com semente fixa prova o mecanismo, não o efeito no mercado. O risco segue exposto até haver medição com carga.

  - id: ratings-double-blind
    statement: As avaliações só aparecem quando as duas partes avaliaram ou o prazo venceu.
    about: [rating]
    kind: economic
    basis: example-tested
    evidence:
      - test: internal/domain/reputation.TestDoubleBlindReveal
