# Intenza: a pilha inteira, com o Toxiproxy no meio de cada fio para o caos.
# make up  (sobe)   ·   make down (derruba)
name: intenza

x-intenza: &intenza
  image: intenza:local
  build:
    context: ..
    dockerfile: deploy/Dockerfile.host
  restart: unless-stopped
  depends_on:
    mongo: {condition: service_healthy}
    redis: {condition: service_healthy}
    kafka: {condition: service_healthy}
    toxiproxy: {condition: service_started}
  environment: &env
    INTENZA_MONGO_URI: mongodb://toxiproxy:27018/?directConnection=true
    INTENZA_MONGO_TIMEOUT: 2s
    INTENZA_REDIS_ADDR: toxiproxy:16379
    INTENZA_KAFKA_BROKERS: toxiproxy:19094
    INTENZA_ESCROW_URL: http://toxiproxy:18090
    INTENZA_WEBHOOK_URL: http://api:8080/v1/webhooks/escrow
    INTENZA_WEBHOOK_SECRET: lab-webhook-secret
    INTENZA_JWT_SECRET: lab-jwt-secret
    INTENZA_FAULTS: "true"
    INTENZA_MIN_WINDOW: PT10S
    INTENZA_SELECTION_WINDOW: PT10M
    INTENZA_FUNDING_WINDOW: PT5M
    INTENZA_INSPECTION_WINDOW: PT2M
    OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317

services:
  mongo:
    image: mongo:9.0
    command: [--replSet, rs0, --bind_ip_all, --wiredTigerCacheSizeGB, "0.25"]
    healthcheck:
      # inicia o replica set na primeira vez; depois só confirma
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    ports: ["27117:27017"] # fora do 27017 para conviver com outros projetos

  redis:
    image: redis:8.8-alpine
    command: [redis-server, --appendonly, "no", --save, ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  kafka:
    # imagem nativa (GraalVM) do Apache Kafka: o mesmo broker com uma fração da memória da JVM
    image: apache/kafka-native:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,CHAOS://:9094
      # clientes da aplicação entram pelo listener CHAOS, anunciado como o Toxiproxy:
      # assim todo o tráfego do broker passa por ele
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,CHAOS://toxiproxy:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,CHAOS:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      # a imagem nativa não traz os scripts: basta o listener aceitar conexão
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: [-host=0.0.0.0, -config=/config/toxiproxy.json]
    volumes: ["./toxiproxy:/config:ro"]
    ports: ["18474:8474"] # API do toxiproxy, usada pelo runner de caos

  psp:
    <<: *intenza
    entrypoint: [/usr/local/bin/intenza-psp]
    depends_on: {}
    environment:
      <<: *env
      INTENZA_HTTP_ADDR: :8090
    ports: ["8090:8090", "9094:9090"]

  api:
    <<: *intenza
    entrypoint: [/usr/local/bin/intenza-api]
    ports: ["8080:8080", "9091:9090"]

  relay:
    <<: *intenza
    entrypoint: [/usr/local/bin/intenza-relay]
    ports: ["9092:9090"]

  worker:
    <<: *intenza
    entrypoint: [/usr/local/bin/intenza-worker]
    ports: ["9093:9090"]

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [obs]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [obs]
    ports: ["16686:16686"]
