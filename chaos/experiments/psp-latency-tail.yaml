id: psp-latency-tail
title: Agente de custódia lento e instável
risk: psp-latency-tail
claims: [psp-calls-bounded]
hypothesis: Com o agente de custódia em cauda lognormal (mediana 800 ms, sigma 1) e 30% de 503, o p99 de publicação e de proposta fica abaixo de 1 s e os acordos ainda chegam à liberação.
cause: Latência e erros injetados no simulador do agente.
mechanism: A saga é assíncrona; cada chamada tem prazo, disjuntor por taxa de falha e retentativa com jitter, então a lentidão fica no worker.
effect: A liquidação atrasa e o disjuntor pode abrir; quem publica e propõe não sente.
load: {rate: 0.4, sellers: 6, propose_p: 0.6, window: PT12S, snipe: 3s, duration: 90s, settlement: true, seed: 13}
steady_state:
  - {name: api viva, http: {url: "http://localhost:8080/healthz", status: 204}}
  - {name: agente vivo, http: {url: "http://localhost:9094/healthz", status: 204}}
method:
  - fault: {service: psp, set: {auto_pay_after: 2s}}
  - wait: 10s
  - fault: {service: psp, set: {latency_median: 800ms, latency_sigma: "1", error_rate: "0.3"}}
  - wait: 60s
  - fault: {service: psp, set: {latency_median: 0s, latency_sigma: "0", error_rate: "0"}}
rollback:
  - fault: {service: psp, set: {latency_median: 0s, latency_sigma: "0", error_rate: "0", auto_pay_after: 0s}}
settle: 30s
verify:
  - {name: p99 de publicação abaixo de 1 s, load: {op: publish, stat: p99}, max: 1}
  - {name: p99 de proposta abaixo de 1 s, load: {op: propose, stat: p99}, max: 1}
  - name: o worker sentiu a falha
    promql: {query: 'sum(increase(intenza_escrow_calls_total{result!="ok"}[5m]))'}
    min: 1
  - {name: acordos liberados apesar da cauda, load: {op: released, stat: count}, min: 1}
